[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chartsmaze-mcp"
version = "0.1.0"
description = "MCP server automating the ChartsMaze + TradingView trading research workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.2.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
chartsmaze-mcp = "chartsmaze_mcp.server:main"
chartsmaze     = "chartsmaze_mcp.cli:main"
chartsmaze-gui = "chartsmaze_mcp.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chartsmaze_mcp"]
